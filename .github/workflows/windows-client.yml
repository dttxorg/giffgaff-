name: Build CTExcel Windows Client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop-client/**"
      - ".github/workflows/windows-client.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: desktop-client/requirements.txt

      - name: Install dependencies
        working-directory: desktop-client
        run: python -m pip install -r requirements.txt

      - name: Run client tests
        working-directory: desktop-client
        run: python -m pytest

      - name: Build Windows client
        working-directory: desktop-client
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name "CTExcelApplyClient" `
            --collect-all "playwright" `
            --collect-all "PySide6" `
            run.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CTExcelApplyClient-win-x64
          path: desktop-client/dist/CTExcelApplyClient
          if-no-files-found: error
